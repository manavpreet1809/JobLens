# Off-white page, dark text, and an ochre accent. No blues.
# Appearance only. Keep credentials in environment variables or secrets.toml.
[theme]
base = "light"
primaryColor = "#8A5A12"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#ECE8DF"
textColor = "#23211D"
linkColor = "#6B4510"
font = "sans serif"
headingFont = "serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
borderColor = "#D6D1C6"
baseRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#8A5A12", "#3D3A34", "#6B7A2C", "#A8492A", "#B8A98A", "#5E4B3C"]

[theme.sidebar]
backgroundColor = "#EFECE5"
secondaryBackgroundColor = "#E4DFD4"
